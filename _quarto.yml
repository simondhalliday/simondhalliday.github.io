website:
  title: "Simon D. Halliday"
  site-url: "https://simondhalliday.com"
  description: "Research, teaching, and writing by Simon D. Halliday."
  favicon: img/avatar-icon.png
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: teaching/index.qmd
        text: Teaching
      - href: writing/index.qmd
        text: Writing
    right:
      - icon: github
        href: https://github.com/simondhalliday
        aria-label: GitHub
      - icon: envelope
        href: mailto:simon.halliday@jhu.edu
        aria-label: Email
  page-footer:
    left: |
      **Simon D. Halliday**<br>
      Associate Research Professor and Associate Director, Center for Economy and Society, SNF Agora Institute, Johns Hopkins University<br>
      [simon.halliday@jhu.edu](mailto:simon.halliday@jhu.edu)
    right:
      - text: Google Scholar
        href: https://scholar.google.com/citations?user=t_gEvDgAAAAJ&hl=en
      - text: ORCID
        href: https://orcid.org/0000-0002-0297-6088
      - text: GitHub
        href: https://github.com/simondhalliday

format:
  html:
    theme: default
    css:
      - progress.css
      - styles/site.css
    toc: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta property="og:site_name" content="Simon D. Halliday">
        <meta property="og:url" content="https://simondhalliday.com">
        <meta name="twitter:card" content="summary">
    smooth-scroll: true

execute:
  freeze: auto
